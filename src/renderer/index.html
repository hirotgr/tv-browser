<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-right">
          <span id="clock" aria-live="polite"></span>
          <button
            id="periodic-capture-button"
            type="button"
            title="Periodic Screen Capture"
            aria-label="Periodic Screen Capture"
            aria-pressed="false"
          >
            C
          </button>
          <span id="capture-blocked-tooltip" role="status" aria-live="polite" aria-hidden="true"></span>
          <button id="new-window-button" type="button" title="New Window" aria-label="New Window">
            N
          </button>
          <div id="width-controls" role="group" aria-label="Window width controls">
            <button id="expand-width-button" type="button" title="Set width to 1920">X+</button>
            <button id="shrink-width-button" type="button" title="Set width to 425">X-</button>
          </div>
          <label class="panel-item" for="width-origin-select">
            <select id="width-origin-select" aria-label="Display Mode">
              <option value="right">Right</option>
              <option value="left">Left</option>
            </select>
          </label>
          <label class="panel-item panel-toggle" for="always-on-top-toggle">
            <span>AoT</span>
            <input id="always-on-top-toggle" type="checkbox" />
          </label>
          <button id="open-settings-button" type="button" aria-label="Open Settings" title="Settings">
            &#9881;
          </button>
        </div>
      </header>

      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <form id="settings-form" novalidate>
          <h2 id="settings-title">Settings</h2>
          <label class="settings-field" for="theme-select">
            <span>Theme</span>
            <select id="theme-select">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <label class="settings-field" for="site-url-input">
            <span>Site URL</span>
            <input
              id="site-url-input"
              type="text"
              maxlength="64"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <fieldset class="settings-field" id="capture-interval-fieldset">
            <legend>Capturing Interval (min)</legend>
            <div id="capture-interval-options" role="radiogroup" aria-label="Capturing Interval (min)">
              <label><input type="radio" name="capture-interval-min" value="1" />1</label>
              <label><input type="radio" name="capture-interval-min" value="5" />5</label>
              <label><input type="radio" name="capture-interval-min" value="15" />15</label>
              <label><input type="radio" name="capture-interval-min" value="30" />30</label>
              <label><input type="radio" name="capture-interval-min" value="60" />60</label>
              <label><input type="radio" name="capture-interval-min" value="240" />240</label>
            </div>
          </fieldset>
          <label class="settings-field" for="capture-file-name-input">
            <span>File Name</span>
            <div class="file-name-row">
              <input
                id="capture-file-name-input"
                type="text"
                maxlength="120"
                autocomplete="off"
                spellcheck="false"
              />
              <span class="file-name-suffix">.png</span>
            </div>
          </label>
          <p id="capture-file-name-error" role="alert" aria-live="polite"></p>
          <label class="settings-field" for="capture-directory-input">
            <span>Download to</span>
            <div class="download-directory-row">
              <input
                id="capture-directory-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="capture-directory-browse-button" type="button">Browse...</button>
            </div>
          </label>
          <p id="capture-directory-error" role="alert" aria-live="polite"></p>
          <p id="site-url-error" role="alert" aria-live="polite"></p>
          <div class="settings-actions">
            <button id="settings-cancel-button" type="button">Cancel</button>
            <button id="settings-save-button" type="submit">Save</button>
          </div>
        </form>
      </dialog>

      <div id="card-frame" aria-hidden="true">
        <button id="resize-handle" type="button" aria-label="Resize component" title="Resize"></button>
      </div>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
